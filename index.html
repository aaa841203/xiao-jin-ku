<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>小金庫✨ · 個人記帳與資產總覽</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C9938A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小金庫">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8; --soft-sage:#C3D8C4;
  --deep-pink:#A97468; --deep-blue:#5F7E90; --deep-sage:#748F76;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --white:#FFFFFF; --border:#E9E4DC; --shadow:rgba(55,53,47,.07);
  --radius-s:10px; --radius-m:14px; --radius-l:20px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--dark);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit; color:inherit;}
button{cursor:pointer; border:none; background:none;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:216px; flex-shrink:0; background:var(--white); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:28px 16px; position:sticky; top:0; height:100vh;
}
.brand{padding:0 10px 26px; }
.brand-mark{font-size:22px; font-weight:900; letter-spacing:.5px;}
.brand-mark span{color:var(--pink);}
.brand-sub{font-size:12px; color:var(--gray); margin-top:4px;}
.nav-list{list-style:none; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-s);
  font-size:14px; font-weight:500; color:var(--medium); transition:background .15s, color .15s; position:relative;
}
.nav-item .n-emoji{font-size:17px; width:20px; text-align:center; flex-shrink:0;}
.nav-item:hover{background:var(--light-pink);}
.nav-item.active{background:var(--pink); color:#fff; font-weight:700;}
.nav-item .nav-dot{width:7px; height:7px; border-radius:50%; background:var(--deep-pink); margin-left:auto; box-shadow:0 0 0 2px #fff;}
.nav-item.active .nav-dot{box-shadow:0 0 0 2px var(--pink);}
.nav-foot{display:flex; flex-direction:column; gap:2px; padding-top:12px; border-top:1px solid var(--border);}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(250,250,248,.9); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
}
.topbar h1{font-size:19px; font-weight:700; position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;}
.topbar .topbar-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--white); border:1px solid var(--border); color:var(--medium); transition:background .15s; font-size:16px; position:relative;
}
.icon-btn:hover{background:var(--light-pink);}
.icon-btn svg{width:17px; height:17px;}
.icon-btn .nav-dot{position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--deep-pink);}
.btn-add{
  display:flex; align-items:center; gap:6px; background:var(--pink); color:#fff; padding:9px 16px;
  border-radius:999px; font-size:13.5px; font-weight:700; box-shadow:0 3px 10px rgba(201,147,138,.35);
}
.btn-add svg{width:15px; height:15px;}
.btn-add:hover{background:var(--deep-pink);}

#page-content{padding:24px 28px 100px; max-width:1180px; width:100%;}

/* ---------- generic components ---------- */
.card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px;}
.section-title{font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
.section-title .hint{font-size:12px; color:var(--gray); font-weight:400;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat-card{
  background:var(--white); border:1px solid var(--border); border-radius:var(--radius-l); padding:18px 20px;
  display:flex; flex-direction:column; gap:6px; position:relative; overflow:hidden;
}
.stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--pink));}
.stat-label{font-size:12.5px; color:var(--gray); font-weight:500;}
.stat-value{font-size:22px; font-weight:900; letter-spacing:.2px;}
.stat-sub{font-size:11.5px; color:var(--gray);}
.stat-value.pos{color:var(--deep-sage);}
.stat-value.neg{color:var(--deep-pink);}

.two-col{display:grid; grid-template-columns:1.15fr .85fr; gap:16px; margin-bottom:20px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}

.period-bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.period-tabs{display:flex; background:var(--light-pink); border-radius:999px; padding:3px; gap:2px;}
.period-tab{padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:500; color:var(--medium);}
.period-tab.active{background:var(--pink); color:#fff; font-weight:700;}
.period-nav{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--dark);}
.period-nav button{width:26px; height:26px; border-radius:50%; background:var(--white); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
.period-nav button:hover{background:var(--light-pink);}
.period-custom{display:flex; align-items:center; gap:6px;}
.period-custom input{border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:12.5px;}
.btn-sm{background:var(--pink); color:#fff; padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:700;}

.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--gray); font-weight:500; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.tx-row:hover{background:var(--light-pink);}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
.amt{font-weight:700; font-variant-numeric:tabular-nums;}
.amt.expense{color:var(--deep-pink);}
.amt.income{color:var(--deep-sage);}
.row-actions{display:flex; gap:6px;}
.mini-btn{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--light-pink); color:var(--medium); flex-shrink:0;}
.mini-btn:hover{background:var(--pink); color:#fff;}
.mini-btn svg{width:13px; height:13px;}

.list-summary{display:flex; gap:18px; font-size:12.5px; margin-bottom:12px; color:var(--gray); flex-wrap:wrap;}
.list-summary b{font-weight:700;}

.empty-state{padding:40px 20px; text-align:center; color:var(--gray);}
.empty-state .es-emoji{font-size:34px; margin-bottom:10px;}
.empty-state p{font-size:13.5px;}

/* filters row for list page */
.filter-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.filter-row input[type="text"], .filter-row select{
  border:1px solid var(--border); background:var(--white); border-radius:10px; padding:9px 12px; font-size:13px; min-width:120px;
}
.filter-row .search-box{position:relative; flex:1; min-width:180px;}
.filter-row .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--gray);}
.filter-row .search-box input{padding-left:32px; width:100%;}

/* donut chart */
.donut-wrap{display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;}
.donut-center-label{font-size:11px; color:var(--gray);}
.donut-center-value{font-size:17px; font-weight:900;}
.legend{display:flex; flex-direction:column; gap:9px; flex:1; min-width:170px;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.legend-row .lg-emoji{width:18px; text-align:center;}
.legend-row .lg-label{flex:1; color:var(--medium);}
.legend-row .lg-val{font-weight:700;}
.legend-row .lg-pct{color:var(--gray); width:38px; text-align:right;}

.progress{height:8px; background:var(--light-pink); border-radius:99px; overflow:hidden;}
.progress > div{height:100%; border-radius:99px; background:var(--sage); transition:width .3s;}
.progress.over > div{background:var(--pink);}

/* reminders */
.reminder-banner{background:var(--light-pink); border:1px solid var(--soft-pink); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:18px;}
.reminder-banner .rb-title{font-size:13px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.reminder-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:7px 0; border-top:1px dashed var(--soft-pink);}
.reminder-row:first-child{border-top:none;}
.reminder-row .rd-left{display:flex; align-items:center; gap:8px;}
.reminder-chip{padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; background:var(--pink); color:#fff;}
.reminder-chip.urgent{background:var(--deep-pink);}

/* budget grid */
.year-switch{display:flex; align-items:center; gap:14px; font-weight:700; font-size:15px; margin-bottom:16px;}
.year-switch button{width:28px; height:28px; border-radius:50%; background:var(--white); border:1px solid var(--border);}
.month-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.month-card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px;}
.month-card .m-name{font-size:13px; font-weight:700; margin-bottom:8px;}
.month-card .m-nums{font-size:11.5px; color:var(--gray); display:flex; justify-content:space-between; margin-bottom:6px;}
.month-card.future{opacity:.55;}
.badge-over{color:var(--deep-pink); font-weight:700;}
.badge-ok{color:var(--deep-sage); font-weight:700;}

/* list item card style (fixed/credit/loan/saving) */
.item-card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.item-card .ic-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.item-card .ic-title{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.item-card .ic-title .ic-emoji{font-size:19px;}
.item-card .ic-sub{font-size:11.5px; color:var(--gray); margin-top:3px; line-height:1.5;}
.item-card .ic-actions{display:flex; gap:6px; flex-shrink:0;}
.ic-figures{display:flex; gap:18px; flex-wrap:wrap;}
.ic-figure{display:flex; flex-direction:column; gap:2px;}
.ic-figure .f-label{font-size:11px; color:var(--gray);}
.ic-figure .f-val{font-size:15px; font-weight:800;}
.cards-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:22px;}

/* simple row list (loans) */
.row-list{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
.list-row{background:var(--white); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:background .12s;}
.list-row:hover{background:var(--light-blue);}
.list-row .lr-emoji{font-size:19px; flex-shrink:0;}
.list-row .lr-name{font-size:14px; font-weight:700; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .lr-total{font-size:13px; color:var(--medium); flex-shrink:0;}
.list-row .lr-pct{font-size:14px; font-weight:800; color:var(--deep-blue); flex-shrink:0; width:44px; text-align:right;}
.list-row .lr-bar{width:70px; height:6px; background:var(--light-blue); border-radius:99px; overflow:hidden; flex-shrink:0;}
.list-row .lr-bar > div{height:100%; background:var(--deep-blue);}

/* budget items */
.budget-item-card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px;}
.bi-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;}
.bi-name{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.bi-emoji{font-size:19px;}
.bi-nums{font-size:11.5px; color:var(--gray); display:flex; justify-content:space-between; margin-bottom:6px;}

/* piggy */
.piggy-wrap{display:flex; flex-direction:column; align-items:center; padding:4px 0 6px;}
.piggy-amt{font-size:25px; font-weight:900; margin-top:6px;}
.piggy-sub{font-size:12px; color:var(--gray); margin-top:2px; text-align:center;}
.piggy-goal-row{display:flex; justify-content:center; margin-top:10px;}

/* emoji picker */
.emoji-grid{display:flex; flex-wrap:wrap; gap:6px;}
.emoji-chip{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--border); background:var(--cream); font-size:18px; display:flex; align-items:center; justify-content:center;}
.emoji-chip.active{background:var(--pink); border-color:var(--pink);}

/* theme color picker */
.theme-swatch-row{display:flex; gap:10px; flex-wrap:wrap;}
.theme-swatch{width:36px; height:36px; border-radius:50%; border:2px solid var(--border); cursor:pointer;}
.theme-swatch.active{border-color:var(--dark); box-shadow:0 0 0 2px var(--white), 0 0 0 4px var(--dark);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(55,53,47,.45); display:none; align-items:flex-end; justify-content:center; z-index:100; padding:0;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white); width:100%; max-width:480px; border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto;
  padding:22px 22px 26px; animation:slideUp .2s ease;
}
@media(min-width:760px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:var(--radius-l); max-height:88vh;}
}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h2{font-size:17px; font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--medium); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; background:var(--cream);
}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field-hint{font-size:11.5px; color:var(--gray); margin-top:-6px; margin-bottom:14px;}
.chip-group{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:8px 14px; border-radius:999px; border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--medium); background:var(--cream);}
.chip.active{background:var(--pink); color:#fff; border-color:var(--pink);}
.chip.income-active{background:var(--sage); border-color:var(--sage);}
.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.cat-chip{padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); font-size:12px; font-weight:700; text-align:center; color:var(--medium); background:var(--cream); display:flex; flex-direction:column; align-items:center; gap:3px;}
.cat-chip .cc-emoji{font-size:18px;}
.cat-chip.active{color:#fff; border-color:transparent;}
.photo-drop{border:1.5px dashed var(--border); border-radius:12px; padding:14px; text-align:center; font-size:12.5px; color:var(--gray); cursor:pointer;}
.photo-preview{position:relative; width:100%; max-width:180px; margin-top:10px;}
.photo-preview img{width:100%; border-radius:12px; display:block;}
.photo-preview .rm{position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:rgba(55,53,47,.65); color:#fff; display:flex; align-items:center; justify-content:center;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn-primary, .btn-secondary, .btn-danger{flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:700; text-align:center;}
.btn-primary{background:var(--pink); color:#fff;}
.btn-primary:hover{background:var(--deep-pink);}
.btn-secondary{background:var(--light-pink); color:var(--dark);}
.btn-secondary:hover{background:var(--soft-pink);}
.btn-danger{background:transparent; color:var(--deep-pink); border:1px solid var(--soft-pink); flex:none; padding:12px 16px;}
.btn-danger:hover{background:var(--light-pink);}

/* toast */
#toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--dark); color:#fff; padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s; z-index:200; max-width:88vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.app-footer{text-align:center; font-size:11.5px; color:var(--gray); padding:18px 20px 22px; border-top:1px solid var(--border);}
.app-footer a{color:var(--pink); font-weight:700;}

/* bottom nav (mobile) */
.bottom-nav{display:none;}
.fab{display:none;}

@media(max-width:900px){
  .sidebar{display:none;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .month-grid{grid-template-columns:repeat(2,1fr);}
  #page-content{padding:16px 14px 112px;}
  .topbar{padding:14px 16px; justify-content:space-between;}
  .topbar h1{position:static; transform:none; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw;}
  .app-footer{padding-bottom:104px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--white); border-top:1px solid var(--border);
    z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); overflow-x:auto; gap:2px;
  }
  .bn-item{flex:1; min-width:56px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:12px; color:var(--gray); font-size:10.5px; font-weight:600; position:relative;}
  .bn-item .n-emoji{font-size:19px;}
  .bn-item.active{color:var(--pink); background:var(--light-pink);}
  .bn-item .bn-dot{position:absolute; top:3px; right:12px; width:7px; height:7px; border-radius:50%; background:var(--deep-pink);}
  .fab{
    display:flex; position:fixed; bottom:64px; right:18px; width:54px; height:54px; border-radius:50%; background:var(--pink); color:#fff;
    align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(201,147,138,.45); z-index:40;
  }
  .fab svg{width:22px; height:22px;}
}
@media(max-width:520px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .month-grid{grid-template-columns:1fr 1fr;}
  .field-row{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">妙<span>帳</span></div>
      <div class="brand-sub">你的錢，去哪了一目瞭然</div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="nav-foot">
      <button class="nav-item" id="backupBtnSide"><span class="n-emoji">⚙️</span><span>設定與備份</span></button>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <h1 id="pageTitle">儀表板</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="helpBtn" title="使用說明">❓</button>
        <button class="icon-btn" id="notifBtn" title="開啟到期提醒通知">🔔</button>
        <button class="icon-btn" id="backupBtnTop" title="設定與備份">⚙️</button>
        <button class="btn-add" id="addTxBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新增記帳
        </button>
      </div>
    </div>

/* ---------------- Storage ---------------- */
const STORAGE_KEY = 'miaoAccountLedger_v1';
function defaultDB(){
  return {
    transactions: [],
    fixedExpenses: [],
    budgetItems: [],
    creditCards: [],
    loans: [],
    savingsPlans: [],
    savingsAccounts: [],
    monthlyBudgets: {},
    cash: { base: 0, goal: 10000 },
    settings: { appName: '小金庫✨', theme: 'red' },
    meta: { createdAt: new Date().toISOString(), hasSeenIntro: false }
  };
}
function migrate(data){
  if(!Array.isArray(data.budgetItems)) data.budgetItems = [];
  if(data.budgetItems.length===0 && data.monthlyBudgets){
    const now=new Date();
    const val = (data.monthlyBudgets[now.getFullYear()]||{})[now.getMonth()+1];
    if(val) data.budgetItems.push({id:uid(), name:'總預算', emoji:'🧾', amount: val});
  }
  data.creditCards = (data.creditCards||[]).map(c=>Object.assign({billingDay:1, dueDay:10, manualOwed:null}, c));
  data.loans = (data.loans||[]).map(l=>Object.assign({billingDay:1, dueDay:10}, l));
  data.savingsPlans = (data.savingsPlans||[]).map(p=>Object.assign({emoji:'🎯'}, p));
  data.savingsAccounts = data.savingsAccounts || [];
  data.fixedExpenses = (data.fixedExpenses||[]).map(f=>Object.assign({}, f));
  data.budgetItems = (data.budgetItems||[]).map(i=>Object.assign({overMsg:'這個月的預算超出嘍！', monthOverrides:{}}, i));
  if(!data.cash) data.cash = {base:0, goal:10000};
  if(data.cash.goal==null) data.cash.goal = 10000;
  if(!data.settings) data.settings = {appName:'小金庫✨', theme:'red'};
  if(!data.settings.appName) data.settings.appName = '小金庫✨';
  if(!data.settings.theme) data.settings.theme = 'red';
  if(!data.meta) data.meta = {createdAt: new Date().toISOString(), hasSeenIntro:false};
  if(data.meta.hasSeenIntro==null) data.meta.hasSeenIntro = false;
  return data;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return migrate(Object.assign(defaultDB(), parsed));
  }catch(e){
    console.error('讀取資料失敗，改用預設資料', e);
    return defaultDB();
  }
}
let db = loadDB();
function saveDB(){

/* ---------------- Utils ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function nowTimeStr(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtMoney(n){
  n = Math.round(n||0);
  const neg = n<0; n = Math.abs(n);
  return (neg?'-':'') + 'NT$' + n.toLocaleString('zh-Hant-TW');
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('zh-Hant-TW'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function dateObjOf(tx){ return new Date(`${tx.date}T${tx.time||'00:00'}:00`); }
function nextOccurrence(day){
  const now = new Date(); now.setHours(0,0,0,0);
  let d = new Date(now.getFullYear(), now.getMonth(), day);
  if(d < now) d = new Date(now.getFullYear(), now.getMonth()+1, day);
  return d;
}
function daysUntil(d){ return Math.ceil((d - new Date(new Date().toDateString()))/86400000); }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function ymKey(y,m){ return `${y}-${pad2(m)}`; }
function generateFixedRecurrences(){
  const today = new Date(new Date().toDateString());
  let changed = false;
  db.fixedExpenses.forEach(f=>{
    if(!f.dueDay || !f.amount) return;
    let startY, startM;
    if(f.lastGeneratedYM){
      const [gy,gm] = f.lastGeneratedYM.split('-').map(Number);
      startY = gm===12 ? gy+1 : gy;
      startM = gm===12 ? 1 : gm+1;
    } else {
      startY = today.getFullYear();
      startM = today.getMonth()+1;
    }
    let y=startY, m=startM, guard=0;
    while((y<today.getFullYear() || (y===today.getFullYear() && m<=today.getMonth()+1)) && guard<36){
      guard++;
      const dueDate = new Date(y, m-1, Math.min(f.dueDay, daysInMonth(y,m)));
      if(dueDate <= today){
        db.transactions.push({
          id: uid(),
          date: `${y}-${pad2(m)}-${pad2(dueDate.getDate())}`,
          time: '',
          category: 'fixed',
          item: f.item,
          amount: f.amount,
          type: 'expense',
          payment: '轉帳',
          note: '固定支出每月自動產生',
          photo: null,
          linkId: f.id,
        });
        f.lastGeneratedYM = ymKey(y,m);
        changed = true;
      }
      m++; if(m>12){m=1; y++;}
    }
  });
  if(changed) saveDB();
}

/* ---------------- Period filter state ---------------- */
const periodStates = {
  dashboard:{mode:'month', ref:new Date()},
  list:{mode:'month', ref:new Date()},
  cash:{mode:'month', ref:new Date()},
  credit:{mode:'month', ref:new Date()},
  loan:{mode:'month', ref:new Date()},
  saving:{mode:'month', ref:new Date()},
  fixed:{mode:'month', ref:new Date()},
};
function getRangeDates(st){
  const ref = st.ref ? new Date(st.ref) : new Date();
  if(st.mode==='day'){
    const s=new Date(ref); s.setHours(0,0,0,0);
    const e=new Date(ref); e.setHours(23,59,59,999);
    return [s,e];
  }
  if(st.mode==='month'){
    const s=new Date(ref.getFullYear(), ref.getMonth(), 1, 0,0,0,0);
    const e=new Date(ref.getFullYear(), ref.getMonth()+1, 0, 23,59,59,999);
    return [s,e];
  }
  if(st.mode==='year'){
    const s=new Date(ref.getFullYear(),0,1,0,0,0,0);
    const e=new Date(ref.getFullYear(),11,31,23,59,59,999);
    return [s,e];
  }
  if(st.mode==='custom'){
    if(!st.start || !st.end) return [null,null];
    return [new Date(st.start+'T00:00:00'), new Date(st.end+'T23:59:59')];
  }
  return [null,null];
}
function getPeriodLabel(st){
  const ref = st.ref || new Date();
  if(st.mode==='day') return `${ref.getFullYear()}/${pad2(ref.getMonth()+1)}/${pad2(ref.getDate())}`;
  if(st.mode==='month') return `${ref.getFullYear()} 年 ${ref.getMonth()+1} 月`;
  if(st.mode==='year') return `${ref.getFullYear()} 年`;
  return '';
}
function shiftPeriod(st, dir){
  const ref = new Date(st.ref||new Date());
  if(st.mode==='day') ref.setDate(ref.getDate()+dir);
  else if(st.mode==='month') ref.setMonth(ref.getMonth()+dir);
  else if(st.mode==='year') ref.setFullYear(ref.getFullYear()+dir);
  st.ref = ref;
}
function filterByPeriod(txs, st){
  const [s,e] = getRangeDates(st);
  if(!s) return txs.slice();
  return txs.filter(t=>{ const d=dateObjOf(t); return d>=s && d<=e; });
}
function renderPeriodBar(pageKey){
  const st = periodStates[pageKey];
  const modes = [['day','日'],['month','月'],['year','年'],['all','全部'],['custom','自訂']];
  let html = `<div class="period-bar" data-page="${pageKey}"><div class="period-tabs">`;
  html += modes.map(([m,l])=>`<button class="period-tab ${st.mode===m?'active':''}" data-mode="${m}">${l}</button>`).join('');
  html += `</div>`;
  if(st.mode==='custom'){
    html += `<div class="period-custom">
      <input type="date" class="p-start" value="${st.start||todayStr()}">
      <span style="color:var(--gray)">～</span>
      <input type="date" class="p-end" value="${st.end||todayStr()}">
      <button class="btn-sm apply-custom">套用</button>
    </div>`;
  } else if(st.mode!=='all'){
    html += `<div class="period-nav"><button class="p-prev">‹</button><span class="period-label">${getPeriodLabel(st)}</span><button class="p-next">›</button></div>`;
  }
  html += `</div>`;
  return html;
}
function bindPeriodBar(container, onChange){
  container.querySelectorAll('.period-bar').forEach(bar=>{
    const pageKey = bar.dataset.page;
    bar.querySelectorAll('.period-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        periodStates[pageKey].mode = btn.dataset.mode;
        onChange();
      });
    });
    const prev = bar.querySelector('.p-prev'), next = bar.querySelector('.p-next');
    if(prev) prev.addEventListener('click', ()=>{ shiftPeriod(periodStates[pageKey], -1); onChange(); });
    if(next) next.addEventListener('click', ()=>{ shiftPeriod(periodStates[pageKey], 1); onChange(); });
    const apply = bar.querySelector('.apply-custom');
    if(apply) apply.addEventListener('click', ()=>{
      periodStates[pageKey].start = bar.querySelector('.p-start').value;
      periodStates[pageKey].end = bar.querySelector('.p-end').value;
      onChange();
    });
  });
}
function periodSummaryHTML(txs){
  const sumExpense = txs.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const sumIncome = txs.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  return `<div class="list-summary">
    <span>共 ${txs.length} 筆</span>
    <span>支出 <b style="color:var(--deep-pink)">${fmtMoney(sumExpense)}</b></span>
    <span>收入 <b style="color:var(--deep-sage)">${fmtMoney(sumIncome)}</b></span>
  </div>`;
}

/* ---------------- Derived calculations ---------------- */
function cashBalance(){
  let bal = db.cash.base||0;
  db.transactions.forEach(t=>{
    if(t.category==='cash'){ bal += t.type==='income' ? t.amount : -t.amount; }
  });
  return bal;
}
function cardFigures(card){
  let spent=0, paid=0;
  db.transactions.forEach(t=>{
    if(t.category==='credit' && t.linkId===card.id){
      if(t.type==='expense') spent += t.amount; else paid += t.amount;
    }
  });
  const autoOwed = Math.max(0, spent-paid);
  const hasManual = card.manualOwed!=null && card.manualOwed!=='';
  const owed = hasManual ? Number(card.manualOwed) : autoOwed;
  const available = (card.limit||0) - owed;
  return {spent, paid, owed, available, autoOwed, hasManual};
}
function loanFigures(loan){
  let paid=0;
  db.transactions.forEach(t=>{
    if(t.category==='loan' && t.linkId===loan.id && t.type==='expense') paid += t.amount;
  });
  const remaining = Math.max(0, (loan.total||0) - paid);
  return {paid, remaining};
}
function loanRemainingTerms(loan){
  if(loan.remainingTermsBase==null || loan.remainingTermsBase==='' || !loan.remainingTermsSetDate) return null;
  const setDate = new Date(loan.remainingTermsSetDate+'T00:00:00');
  const today = new Date(new Date().toDateString());
  let months = (today.getFullYear()-setDate.getFullYear())*12 + (today.getMonth()-setDate.getMonth());
  const dueDay = loan.dueDay || setDate.getDate();
  if(today.getDate() < dueDay) months -= 1;
  months = Math.max(0, months);
  return Math.max(0, Math.round(loan.remainingTermsBase) - months);
}
function savingFigures(plan){
  let current=0;
  db.transactions.forEach(t=>{
    if(t.category==='saving' && t.linkId===plan.id){
      current += t.type==='income' ? t.amount : -t.amount;
    }
  });
  current = Math.max(0, current);
  const target = plan.target||0;
  const pct = target>0 ? Math.min(100, Math.round(current/target*100)) : 0;
  let daysLeft = null;
  if(plan.targetDate){
    const d = new Date(plan.targetDate+'T00:00:00');
    daysLeft = Math.ceil((d - new Date(new Date().toDateString())) / 86400000);
  }
  return {current, pct, daysLeft};
}
function totalAssets(){
  let s = cashBalance();
  db.savingsPlans.forEach(p=>{ s += savingFigures(p).current; });
  return s;
}
function totalLiabilities(){
  let s = 0;
  db.creditCards.forEach(c=>{ s += cardFigures(c).owed; });
  db.loans.forEach(l=>{ s += loanFigures(l).remaining; });
  return s;
}
function categoryMonthSpend(catKey, year, month, linkId){
  const s = new Date(year, month-1, 1, 0,0,0,0);
  const e = new Date(year, month, 0, 23,59,59,999);
  let sum = 0;
  db.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    if(t.category!==catKey) return;
    if(linkId!=null && t.linkId!==linkId) return;
    const d = dateObjOf(t);
    if(d>=s && d<=e) sum += t.amount;
  });
  return sum;
}
function budgetItemActual(itemId, year, month){
  const s = new Date(year, month-1, 1, 0,0,0,0);
  const e = new Date(year, month, 0, 23,59,59,999);
  let sum = 0;
  db.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    const d = dateObjOf(t);
    if(d<s || d>e) return;
    if(t.category==='budget' && t.linkId===itemId) sum += t.amount;
    else if((t.category==='cash'||t.category==='credit') && t.budgetLinkId===itemId) sum += t.amount;
  });
  return sum;
}
function budgetTotalActual(year, month){
  const s = new Date(year, month-1, 1, 0,0,0,0);
  const e = new Date(year, month, 0, 23,59,59,999);
  let sum = 0;
  db.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    const d = dateObjOf(t);
    if(d<s || d>e) return;
    if(t.category==='budget') sum += t.amount;
    else if((t.category==='cash'||t.category==='credit') && t.budgetLinkId) sum += t.amount;
  });
  return sum;
}
function budgetTotalAmount(){ return db.budgetItems.reduce((a,i)=>a+(i.amount||0),0); }
function budgetItemAmountForMonth(item, year, month){
  const key = ymKey(year, month);
  if(item.monthOverrides && item.monthOverrides[key]!=null && item.monthOverrides[key]!=='') return Number(item.monthOverrides[key]);
  return item.amount||0;
}
function budgetTotalAmountForMonth(year, month){
  return db.budgetItems.reduce((a,i)=>a+budgetItemAmountForMonth(i, year, month),0);
}

/* ---------------- Reminders ---------------- */
function computeReminders(){
  const list = [];
  db.creditCards.forEach(c=>{
    if(!c.dueDay) return;
    const d = nextOccurrence(c.dueDay), dl = daysUntil(d);
    if(dl<=3 && dl>=0){
      const fig = cardFigures(c);
      list.push({cat:'credit', emoji:'💳', label:`${c.bank} 繳款`, daysLeft:dl, amount:fig.owed});
    }
  });
  db.loans.forEach(l=>{
    if(!l.dueDay) return;
    const d = nextOccurrence(l.dueDay), dl = daysUntil(d);
    if(dl<=3 && dl>=0) list.push({cat:'loan', emoji:'🏦', label:`${l.name} 繳款`, daysLeft:dl, amount:l.monthlyPay||0});
  });
  list.sort((a,b)=>a.daysLeft-b.daysLeft);
  return list;
}
function reminderCatSet(){ return new Set(computeReminders().map(r=>r.cat)); }
function reminderBannerHTML(list){
  if(!list.length) return '';
  return `<div class="reminder-banner"><div class="rb-title">⏰ 到期提醒</div>

/* ---------------- Donut chart (SVG) ---------------- */
function donutSVG(rings, size=150){
  const cx=size/2, cy=size/2;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%; height:auto; display:block;">`;
  rings.forEach(ring=>{
    const total = ring.segments.reduce((a,s)=>a+s.value,0);
    const circ = 2*Math.PI*ring.radius;
    if(total<=0){
      svg += `<circle cx="${cx}" cy="${cy}" r="${ring.radius}" fill="none" stroke="#EFEAE3" stroke-width="${ring.strokeWidth}"/>`;
      return;
    }
    let cum = 0;
    ring.segments.forEach(seg=>{
      if(seg.value<=0) return;
      const frac = seg.value/total;
      const dash = frac*circ;
      const gap = circ-dash;
      const offset = -(cum/total)*circ;
      svg += `<circle cx="${cx}" cy="${cy}" r="${ring.radius}" fill="none" stroke="${seg.color}" stroke-width="${ring.strokeWidth}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
      cum += seg.value;
    });
  });
  svg += `</svg>`;
  return svg;
}

      const actual = budgetItemActual(item.id, now.getFullYear(), now.getMonth()+1);
      const monthAmount = budgetItemAmountForMonth(item, now.getFullYear(), now.getMonth()+1);
      const isOverride = item.monthOverrides && item.monthOverrides[ymKey(now.getFullYear(), now.getMonth()+1)]!=null && item.monthOverrides[ymKey(now.getFullYear(), now.getMonth()+1)]!=='';
      const ip = monthAmount>0 ? Math.min(100, Math.round(actual/monthAmount*100)) : 0;

          <div class="bi-name"><span class="bi-emoji">${item.emoji||'🧾'}</span>${esc(item.name)}</div>

        </div>
        <div class="bi-nums"><span>本月花費 ${fmtNum(actual)}</span><span>預算 ${fmtNum(monthAmount)}${isOverride?'（本月已個別設定）':''}</span></div>

        <div style="margin-top:6px; font-size:11.5px;" class="${actual>monthAmount?'badge-over':'badge-ok'}">${actual>monthAmount?`${esc(item.overMsg||'這個月的預算超出嘍！')}（超支 ${fmtNum(actual-monthAmount)}）`:`剩餘 ${fmtNum(monthAmount-actual)}`}</div>

      db.budgetItems = db.budgetItems.filter(i=>i.id!==b.dataset.id);
      saveDB(); toast('已刪除'); renderBudget();
    }
  }));
  el.querySelector('#addBudgetItem').addEventListener('click', ()=>openBudgetItemModal(null));
}
function openBudgetItemModal(id){
  const item = id ? db.budgetItems.find(i=>i.id===id) : {name:'', emoji:'🍚', amount:'', overMsg:'這個月的預算超出嘍！', monthOverrides:{}};
  if(!item.monthOverrides) item.monthOverrides = {};
  let curEmoji = item.emoji || '🍚';
  function monthOverrideRowsHTML(){
    const keys = Object.keys(item.monthOverrides).sort();
    if(!keys.length) return `<div class="field-hint" style="margin-top:0;">目前沒有針對特定月份另外設定金額</div>`;
    return keys.map(k=>`<div class="list-row" style="cursor:default; padding:8px 12px;">
      <span class="lr-name">${k}</span>
      <span class="lr-total">${fmtMoney(item.monthOverrides[k])}</span>
      <button class="mini-btn bi-mo-del" data-k="${k}">${ICON.trash}</button>
    </div>`).join('');
  }
  openModal(`
    <div class="modal-head"><h2>${id?'編輯':'新增'}預算項目</h2><button class="icon-btn" id="mClose">${ICON.close}</button></div>
    <div class="field"><label>項目名稱</label><input type="text" id="bi-name" value="${esc(item.name)}" placeholder="例如：吃飯、娛樂、交通"></div>
    <div class="field"><label>選個可愛圖案</label><div class="emoji-grid" id="bi-emoji-grid">${EMOJI_CHOICES.map(e=>`<button type="button" class="emoji-chip ${e===curEmoji?'active':''}" data-e="${e}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>預設每月預算金額</label><input type="number" id="bi-amount" value="${item.amount}" min="0" placeholder="例如 8000"></div>
    <p class="field-hint">沒有另外設定金額的月份，會固定沿用這個金額</p>
    <div class="field"><label>超支提醒文字</label><input type="text" id="bi-overmsg" value="${esc(item.overMsg||'這個月的預算超出嘍！')}" placeholder="這個月的預算超出嘍！" maxlength="30"></div>
    <p class="field-hint">超過這個項目的預算時，會用紅字顯示這句話</p>
    ${id ? `
    <div class="field">
      <label>指定月份金額（選填，例如 9 月訂 8000、10 月訂 10000）</label>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <input type="month" id="bi-mo-month" value="${todayStr().slice(0,7)}" style="flex:1;">
        <input type="number" id="bi-mo-amount" placeholder="金額" min="0" style="flex:1;">
        <button class="btn-sm" id="bi-mo-add">設定</button>
      </div>
      <div id="bi-mo-list">${monthOverrideRowsHTML()}</div>
    </div>
    ` : `<p class="field-hint">先儲存這個項目，之後再進來編輯就可以設定個別月份的金額</p>`}
    <div class="modal-actions">
      <button class="btn-secondary" id="mCancel">取消</button>
      <button class="btn-primary" id="bi-save">儲存</button>
    </div>
  `);
  bindModalClose();
  document.querySelectorAll('#bi-emoji-grid .emoji-chip').forEach(c=>c.addEventListener('click', ()=>{
    curEmoji = c.dataset.e;
    document.querySelectorAll('#bi-emoji-grid .emoji-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
  }));
  if(id){
    function bindMoListEvents(){
      document.querySelectorAll('.bi-mo-del').forEach(b=>b.addEventListener('click', ()=>{
        delete item.monthOverrides[b.dataset.k];
        saveDB();
        document.getElementById('bi-mo-list').innerHTML = monthOverrideRowsHTML();
        bindMoListEvents();
        rerender();
      }));
    }
    bindMoListEvents();
    document.getElementById('bi-mo-add').addEventListener('click', ()=>{
      const monthVal = document.getElementById('bi-mo-month').value;
      const amtVal = document.getElementById('bi-mo-amount').value;
      if(!monthVal){ toast('請選擇月份'); return; }
      if(amtVal===''){ toast('請輸入金額'); return; }
      const [y,m] = monthVal.split('-').map(Number);
      item.monthOverrides[ymKey(y,m)] = parseFloat(amtVal)||0;
      saveDB();
      document.getElementById('bi-mo-list').innerHTML = monthOverrideRowsHTML();
      bindMoListEvents();
      document.getElementById('bi-mo-amount').value = '';
      toast('已設定'); rerender();
    });
  }
  document.getElementById('bi-save').addEventListener('click', ()=>{
    const val = {
      id: id || uid(),
      name: document.getElementById('bi-name').value.trim() || '未命名項目',
      emoji: curEmoji,
      amount: parseFloat(document.getElementById('bi-amount').value)||0,
      overMsg: document.getElementById('bi-overmsg').value.trim() || '這個月的預算超出嘍！',
      monthOverrides: item.monthOverrides || {},
    };
    if(id) db.budgetItems = db.budgetItems.map(i=>i.id===id?val:i);
    else db.budgetItems.push(val);
    saveDB(); closeModal(); toast('已儲存'); rerender();
  });
}

  const el = document.getElementById('page-content');

  el.innerHTML = `

      <div class="section-title">現金收支紀錄</div>
      ${renderPeriodBar('cash')}

        <select id="cash-lf-payment">
          <option value="">現金支付／轉帳支付（全部）</option>
          <option value="現金" ${cashFilters.payment==='現金'?'selected':''}>現金支付</option>

    const amtInput = el.querySelector('#quickAmt');

    if(!amt || amt<=0){ toast('請輸入金額'); amtInput.focus(); return; }

    db.transactions.push({
      id: uid(), date: todayStr(), time: nowTimeStr(), category:'cash', item: itemVal,
      amount: amt, type:'expense', payment:'現金', note:'', photo:null, linkId:'', budgetLinkId:'',

    });
    saveDB();
    toast('已記錄！有空再回來補分類細節');
    renderCash();
  }
  el.querySelector('#quickAddBtn').addEventListener('click', doQuickAdd);
  el.querySelector('#quickAmt').addEventListener('keydown', e=>{ if(e.key==='Enter') doQuickAdd(); });
  el.querySelector('#quickItem').addEventListener('keydown', e=>{ if(e.key==='Enter') doQuickAdd(); });

function renderCashTx(){
  const area = document.getElementById('cashTxArea');
  if(!area) return;

  txs.sort((a,b)=>dateObjOf(b)-dateObjOf(a));
  area.innerHTML = periodSummaryHTML(txs) + (txs.length ? `<div class="table-wrap"><table><tbody>${txs.map(t=>txRowHTML(t)).join('')}</tbody></table></div>` : `<div class="empty-state"><div class="es-emoji">🐷</div><p>這個期間沒有符合條件的現金紀錄</p></div>`);

function openCashAdjustModal(){
  const bal = cashBalance();
  openModal(`

      <label>六大分類</label>
      <div class="cat-grid" id="tx-cat-grid">
        ${CATEGORIES.map(c=>`<button type="button" class="cat-chip ${item.category===c.key?'active':''}" data-cat="${c.key}" style="${item.category===c.key?`background:${c.color}`:''}"><span class="cc-emoji">${c.emoji}</span>${c.label}</button>`).join('')}
      </div>
    </div>

    <div class="field" id="tx-link-field" style="display:none;"></div>
    <div class="field" id="tx-budget-link-field" style="display:none;"></div>

    <div class="field" id="tx-item-field"><label>品項</label><input type="text" id="tx-item" value="${esc(item.item)}" placeholder="例如：午餐、薪水、租金"></div>

    <div class="field-row">
      <div class="field"><label>金額</label><input type="number" id="tx-amount" value="${item.amount}" min="0"></div>
      <div class="field" id="tx-payment-field"></div>
    </div>

    <div class="field"><label>日期</label><input type="date" id="tx-date" value="${item.date}"></div>

    <div class="field"><label>備註</label><textarea id="tx-note" placeholder="選填">${esc(item.note||'')}</textarea></div>

    <div class="modal-actions">
      ${id? `<button class="btn-danger" id="tx-del">${ICON.trash}</button>` : ''}
      <button class="btn-secondary" id="mCancel">取消</button>
      <button class="btn-primary" id="tx-save">儲存</button>
    </div>
  `);
  bindModalClose();

  let curType = item.type, curCat = item.category, curLink = item.linkId||'', curBudgetLink = item.budgetLinkId||'', curPayment = item.payment||'現金';

  function refreshLinkField(){
    const wrap = document.getElementById('tx-link-field');
    if(curCat==='credit'){
      wrap.style.display='';
      wrap.innerHTML = `<label>選擇信用卡</label><select id="tx-link">${db.creditCards.length? db.creditCards.map(c=>`<option value="${c.id}" ${curLink===c.id?'selected':''}>${esc(c.bank)}</option>`).join('') : '<option value="">請先到「信用卡」頁面新增卡片</option>'}</select>`;
    } else if(curCat==='loan'){
      wrap.style.display='';
      wrap.innerHTML = `<label>選擇貸款</label><select id="tx-link">${db.loans.length? db.loans.map(l=>`<option value="${l.id}" ${curLink===l.id?'selected':''}>${esc(l.name)}</option>`).join('') : '<option value="">請先到「貸款」頁面新增項目</option>'}</select>`;
    } else if(curCat==='saving'){
      wrap.style.display='';
      wrap.innerHTML = `<label>選擇存錢計畫（收入＝存入，支出＝提領）</label><select id="tx-link">${db.savingsPlans.length? db.savingsPlans.map(p=>`<option value="${p.id}" ${curLink===p.id?'selected':''}>${esc(p.item)}</option>`).join('') : '<option value="">請先到「存錢計畫」頁面新增計畫</option>'}</select>`;
    } else if(curCat==='fixed'){
      wrap.style.display='';
      wrap.innerHTML = `<label>對應固定支出項目（選填）</label><select id="tx-link"><option value="">不指定</option>${db.fixedExpenses.map(f=>`<option value="${f.id}" ${curLink===f.id?'selected':''}>${esc(f.item)}</option>`).join('')}</select>`;
      wrap.querySelector('#tx-link').addEventListener('change', e=>{
        const f = db.fixedExpenses.find(x=>x.id===e.target.value);
        if(f){ document.getElementById('tx-item').value = f.item; document.getElementById('tx-amount').value = f.amount; }
      });
    } else if(curCat==='budget'){
      wrap.style.display='';
      wrap.innerHTML = `<label>預算項目（選填，例如吃飯／娛樂）</label><select id="tx-link"><option value="">未分類</option>${db.budgetItems.map(i=>`<option value="${i.id}" ${curLink===i.id?'selected':''}>${i.emoji||''} ${esc(i.name)}</option>`).join('')}</select>`;
    } else {
      wrap.style.display='none'; wrap.innerHTML='';
    }
  }

  function refreshBudgetLinkField(){
    const wrap = document.getElementById('tx-budget-link-field');
    if((curCat==='cash' || curCat==='credit') && curType==='expense'){
      wrap.style.display='';
      wrap.innerHTML = `<label>歸屬預算項目（選填，例如吃飯／娛樂）</label><select id="tx-budget-link"><option value="">不歸類</option>${db.budgetItems.map(i=>`<option value="${i.id}" ${curBudgetLink===i.id?'selected':''}>${i.emoji||''} ${esc(i.name)}</option>`).join('')}</select>`;
    } else {
      wrap.style.display='none'; wrap.innerHTML='';
    }
  }

  function refreshItemAndPaymentField(){
    const itemField = document.getElementById('tx-item-field');
    const payWrap = document.getElementById('tx-payment-field');
    if(curCat==='saving'){
      itemField.style.display='none';
      payWrap.innerHTML = `<label>存在哪裡</label><select id="tx-payment">${db.savingsAccounts.length? db.savingsAccounts.map(a=>`<option value="${esc(a.name)}" ${curPayment===a.name?'selected':''}>${esc(a.name)}</option>`).join('') : '<option value="">請先在「存錢計畫」頁面新增帳戶</option>'}</select>`;
    } else {
      itemField.style.display='';
      payWrap.innerHTML = `<label>支付方式</label><select id="tx-payment">${PAYMENTS.map(p=>`<option value="${p}" ${curPayment===p?'selected':''}>${p}</option>`).join('')}</select>`;
    }
  }

  refreshLinkField();
  refreshBudgetLinkField();
  refreshItemAndPaymentField();

  document.querySelectorAll('#modalBody .chip[data-type]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      curType = chip.dataset.type;
      document.querySelectorAll('#modalBody .chip[data-type]').forEach(c=>{c.classList.remove('active','income-active');});
      chip.classList.add('active'); if(curType==='income') chip.classList.add('income-active');
      refreshBudgetLinkField();
    });
  });
  document.querySelectorAll('#tx-cat-grid .cat-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      curCat = chip.dataset.cat; curLink=''; curBudgetLink=''; curPayment = curCat==='saving' ? '' : '現金';
      document.querySelectorAll('#tx-cat-grid .cat-chip').forEach(c=>{c.classList.remove('active'); c.style.background='';});
      chip.classList.add('active'); chip.style.background = CAT_MAP[curCat].color;
      refreshLinkField();
      refreshBudgetLinkField();
      refreshItemAndPaymentField();
    });
  });

  document.getElementById('tx-del')?.addEventListener('click', ()=>{
    if(confirm('確定要刪除這筆記帳嗎？')){
      db.transactions = db.transactions.filter(t=>t.id!==id);
      saveDB(); closeModal(); toast('已刪除'); rerender();
    }
  });

  document.getElementById('tx-save').addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('tx-amount').value)||0;
    const linkSel = document.getElementById('tx-link');
    const budgetLinkSel = document.getElementById('tx-budget-link');
    let itemName = '';
    if(curCat==='saving'){
      const plan = linkSel ? db.savingsPlans.find(p=>p.id===linkSel.value) : null;
      if(!plan){ toast('請選擇存錢計畫'); return; }
      itemName = plan.item;
    } else {
      itemName = document.getElementById('tx-item').value.trim();
      if(!itemName){ toast('請輸入品項'); return; }
    }
    if(amount<=0){ toast('請輸入金額'); return; }
    const val = {
      id: id || uid(),
      date: document.getElementById('tx-date').value || todayStr(),
      category: curCat,
      item: itemName,
      amount,
      type: curType,
      payment: document.getElementById('tx-payment').value,
      note: document.getElementById('tx-note').value.trim(),
      linkId: linkSel ? linkSel.value : '',
      budgetLinkId: budgetLinkSel ? budgetLinkSel.value : '',
      quickAdded: false,
    };
    if(id) db.transactions = db.transactions.map(t=>t.id===id?val:t);
    else db.transactions.push(val);
    saveDB(); closeModal(); toast('已儲存'); rerender();
  });
}

/* ---------------- Intro guide ---------------- */
function openIntroModal(){
  db.meta.hasSeenIntro = true;
  saveDB();
  openModal(`
    <div class="modal-head"><h2>👋 歡迎使用 ${esc(appName())}</h2><button class="icon-btn" id="mClose">${ICON.close}</button></div>
    <p style="font-size:13.5px; color:var(--medium); line-height:1.7; margin-bottom:14px;">這是一個記帳與資產總覽的小工具，幫你把收支、預算、信用卡、貸款、存錢計畫都放在同一個地方看。</p>
    <div style="margin-bottom:14px;">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">左邊選單可以做這些事：</div>
      <ul style="font-size:13px; color:var(--medium); line-height:1.9; padding-left:18px; margin:0;">
        <li>📊 儀表板：看整體收支、資產總覽</li>
        <li>🧾 每月預算：設定每個月各項目的花費上限</li>
        <li>📅 固定支出：房租、訂閱這類每月固定要繳的錢</li>
        <li>🐷 現金：記錄手邊現金的收支</li>
        <li>💳 信用卡：追蹤刷卡金額跟繳款日</li>
        <li>🏦 貸款：追蹤貸款還款進度</li>
        <li>🎯 存錢計畫：設定存錢目標，追蹤進度</li>
      </ul>
    </div>
    <p style="font-size:13px; color:var(--medium); line-height:1.7; margin-bottom:14px;">先按右上角「+ 新增記帳」記第一筆帳看看！</p>
    <p style="font-size:12px; color:var(--gray); line-height:1.6; margin-bottom:16px;">💡 記得到「設定與備份」（⚙️）裡看看，可以改名字、換喜歡的顏色，也可以匯出備份檔——資料只存在這個瀏覽器裡，換裝置前記得先備份喔。之後想再看一次這份說明，按右上角「❓」就可以了。</p>
    <button class="btn-primary" id="introStart" style="width:100%;">開始使用</button>
  `);
  bindModalClose();
  document.getElementById('introStart').addEventListener('click', closeModal);
}

/* ---------------- Backup / Restore ---------------- */
function openBackupModal(){
  openModal(`
    <div class="modal-head"><h2>設定與備份</h2><button class="icon-btn" id="mClose">${ICON.close}</button></div>
    <div class="field"><label>App 名稱</label><input type="text" id="set-appname" value="${esc(appName())}" placeholder="小金庫✨" maxlength="12"></div>
    <button class="btn-primary" id="saveAppName" style="margin-bottom:20px; width:100%;">儲存名稱</button>
    <div class="field">
      <label>介面顏色</label>
      <div class="theme-swatch-row">
        ${Object.entries(THEMES).map(([key,t])=>`<button type="button" class="theme-swatch ${(db.settings.theme||'red')===key?'active':''}" data-key="${key}" style="background:${t.swatch}" title="${t.label}"></button>`).join('')}
      </div>
    </div>
    <p style="font-size:13px; color:var(--medium); margin-bottom:16px; line-height:1.6;">所有資料都只存在這個瀏覽器裡。換裝置、清除瀏覽器資料或重灌前，請先匯出備份檔，之後可以再匯入回來。</p>
    <button class="btn-primary" id="doExport" style="margin-bottom:10px; width:100%;">匯出備份檔（.json）</button>
    <label class="btn-secondary" style="display:block; width:100%; text-align:center;">
      匯入備份檔
      <input type="file" id="doImport" accept="application/json" style="display:none;">
    </label>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn-secondary" id="mCancel" style="flex:1;">關閉</button>
    </div>
  `);
  bindModalClose();
  document.getElementById('saveAppName').addEventListener('click', ()=>{
    const v = document.getElementById('set-appname').value.trim();
    db.settings.appName = v || '小金庫✨';
    saveDB(); renderBrand(); buildNav(); toast('名稱已更新');
  });
  document.querySelectorAll('.theme-swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      db.settings.theme = btn.dataset.key;
      saveDB();
      applyTheme(db.settings.theme);
      document.querySelectorAll('.theme-swatch').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      toast('顏色已更新');
    });
  });
  document.getElementById('doExport').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url; a.download = `${appName()}備份_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已下載備份檔');
  });
  document.getElementById('doImport').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!confirm('匯入將會覆蓋目前瀏覽器內的所有資料，確定要繼續嗎？')) return;
        db = migrate(Object.assign(defaultDB(), parsed));
        saveDB(); closeModal(); toast('匯入成功'); renderBrand(); goTo('dashboard');
      }catch(err){
        toast('檔案格式錯誤，匯入失敗');
      }
    };
    reader.readAsText(file);
  });
}

/* ---------------- Init ---------------- */
document.getElementById('addTxBtn').addEventListener('click', ()=>openTxModal(null));
document.getElementById('fabAdd').addEventListener('click', ()=>openTxModal(null));
document.getElementById('backupBtnSide').addEventListener('click', openBackupModal);
document.getElementById('backupBtnTop').addEventListener('click', openBackupModal);
document.getElementById('helpBtn').addEventListener('click', openIntroModal);
document.getElementById('notifBtn').addEventListener('click', ()=>{
  if(typeof Notification==='undefined'){ toast('這個瀏覽器不支援通知'); return; }
  if(Notification.permission==='granted'){ toast('提醒通知已經開啟囉'); maybeNotify(); }
  else if(Notification.permission==='denied'){ toast('請到瀏覽器設定允許通知'); }
  else{
    Notification.requestPermission().then(p=>{
      if(p==='granted'){ toast('已開啟到期提醒通知'); maybeNotify(); buildNav(); }
      else toast('未開啟通知，仍會在畫面上提醒你');
    });
  }
});

renderBrand();
applyTheme(db.settings.theme || 'red');
generateFixedRecurrences();
buildNav();
renderDashboard();
maybeNotify();
if(!db.meta.hasSeenIntro) openIntroModal();
</script>
</body>
</html>
